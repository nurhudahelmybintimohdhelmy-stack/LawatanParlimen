<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Tempahan Lawatan Parlimen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Panel Admin — Tempahan Lawatan Parlimen</h1>
  <p><a href="index.html">&laquo; Kembali ke borang tempahan</a></p>
</header>
<main>
  <div id="setupWarn" class="msg error hidden">
    URL Apps Script belum dikonfigurasi. Isi <code>config.js</code> mengikut panduan dalam README.
  </div>

  <section class="card" id="loginCard">
    <h2>Log masuk admin</h2>
    <form id="loginForm">
      <label>Token admin<input type="password" id="token" required autocomplete="off"></label>
      <button class="primary" type="submit">Muat tempahan</button>
    </form>
    <div id="msg" class="msg hidden"></div>
  </section>

  <section class="card hidden" id="panel">
    <h2>Senarai tempahan <button type="button" id="logoutBtn" style="float:right;font-size:.8rem">Keluar</button></h2>
    <div class="toolbar">
      <label>Status
        <select id="statusFilter">
          <option value="">Semua</option>
          <option value="pending">Menunggu</option>
          <option value="confirmed">Disahkan</option>
          <option value="cancelled">Dibatalkan</option>
        </select>
      </label>
      <label>Dari<input type="date" id="from"></label>
      <label>Hingga<input type="date" id="to"></label>
      <button class="primary" type="button" id="exportBtn">⬇ Eksport Excel (disahkan sahaja)</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Rujukan</th><th>Tarikh</th><th>Masa</th><th>Penempah</th><th>Peserta</th><th>Status</th><th>Tindakan</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
